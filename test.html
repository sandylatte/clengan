<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MoneyTrack tests</title>
<style>
body { font-family: system-ui, sans-serif; background: #0F172A; color: #fff; padding: 24px; }
li { margin-bottom: 6px; }
.pass::before { content: "PASS "; color: #059669; font-weight: 700; }
.fail::before { content: "FAIL "; color: #DC2626; font-weight: 700; }
pre { color: #DC2626; margin: 4px 0 0 24px; }
</style>
</head>
<body>
<h1>MoneyTrack tests</h1>
<p id="summary">running…</p>
<ul id="results"></ul>

<script type="module">
import * as db from './db.js';

// This page imports the app's real modules, so a service worker will serve
// them FROM ITS CACHE — including a version from before the change you are
// trying to test. That is not theoretical: reintroducing a known db.js bug
// left this suite reporting 22/22, because the worker was still handing out
// the fixed copy. A green run under a controlling worker means nothing.
if (navigator.serviceWorker && navigator.serviceWorker.controller) {
  document.getElementById('summary').textContent =
    'Not run: a service worker controls this page and would serve cached modules.';
  document.getElementById('summary').style.color = '#DC2626';
  const how = document.createElement('p');
  how.textContent = 'Unregister it first — Settings → App version → Fetch the latest version, '
    + 'or run this in a private window.';
  document.getElementById('summary').after(how);
  throw new Error('service worker present; refusing to report a result that cannot be trusted');
}

// Point the data layer at a SEPARATE database before anything touches it.
//
// These tests call clearAll(), and until this line they called it on the real
// one — opening this page wiped every transaction and account the user had.
// db.openDb memoises on first call, which is exactly the hook needed: every
// later call inside db.js reuses this connection, so the whole suite runs
// against moneytrack-test and the app's own data is never opened at all.
await db.openDb('moneytrack-test');

const tests = [];
const test = (name, fn) => tests.push({ name, fn });
const results = document.getElementById('results');

test('addFlow stores one row with a derived-expense sign', async () => {
  await db.clearAll();
  const id = await db.addFlow({ date: '2026-08-03', account: 'Bank', amount: -4500, category: 'Food', note: '' });
  const rows = await db.allTransactions();
  if (rows.length !== 1) throw new Error(`expected 1 row, got ${rows.length}`);
  if (rows[0].id !== id) throw new Error('returned id does not match the stored row');
  if (rows[0].amount !== -4500) throw new Error(`amount changed: ${rows[0].amount}`);
  if (rows[0].transfer_id !== null) throw new Error('a flow must not have a transfer_id');
});

test('addTransfer writes two rows pointing at each other', async () => {
  await db.clearAll();
  const [fromId, toId] = await db.addTransfer({ date: '2026-08-06', from: 'Bank', to: 'Savings', amount: 20000, note: '' });
  const rows = await db.allTransactions();
  if (rows.length !== 2) throw new Error(`expected 2 rows, got ${rows.length}`);
  const from = rows.find((r) => r.id === fromId);
  const to = rows.find((r) => r.id === toId);
  if (from.amount !== -20000) throw new Error(`source must be negative, got ${from.amount}`);
  if (to.amount !== 20000) throw new Error(`destination must be positive, got ${to.amount}`);
  if (from.transfer_id !== toId || to.transfer_id !== fromId) throw new Error('rows do not point at each other');
});

test('addTransfer rejects a non-positive amount', async () => {
  await db.clearAll();
  let threw = false;
  try {
    await db.addTransfer({ date: '2026-08-06', from: 'Bank', to: 'Savings', amount: -1, note: '' });
  } catch { threw = true; }
  if (!threw) throw new Error('a negative transfer amount must be rejected');
});

test('addTransfer rejects a transfer to the same account', async () => {
  await db.clearAll();
  let threw = false;
  try {
    await db.addTransfer({ date: '2026-08-06', from: 'Bank', to: 'Bank', amount: 100, note: '' });
  } catch { threw = true; }
  if (!threw) throw new Error('a self-transfer must be rejected');
});

test('deleting one side of a transfer deletes both', async () => {
  await db.clearAll();
  const [fromId] = await db.addTransfer({ date: '2026-08-06', from: 'Bank', to: 'Savings', amount: 20000, note: '' });
  await db.deleteTransaction(fromId);
  const rows = await db.allTransactions();
  if (rows.length !== 0) throw new Error(`orphaned half left behind: ${rows.length} rows remain`);
});

test('deleting a flow leaves other rows untouched', async () => {
  await db.clearAll();
  const keep = await db.addFlow({ date: '2026-08-01', account: 'Bank', amount: 300000, category: 'Salary', note: '' });
  const drop = await db.addFlow({ date: '2026-08-03', account: 'Bank', amount: -4500, category: 'Food', note: '' });
  await db.deleteTransaction(drop);
  const rows = await db.allTransactions();
  if (rows.length !== 1 || rows[0].id !== keep) throw new Error('wrong row deleted');
});

test('putTransactions is idempotent on repeated import', async () => {
  await db.clearAll();
  const rows = [
    { id: 'x1', date: '2026-08-01', account: 'Bank', amount: 1000, category: 'Salary', transfer_id: null, note: '' },
    { id: 'x2', date: '2026-08-02', account: 'Bank', amount: -250, category: 'Food', transfer_id: null, note: '' },
  ];
  await db.putTransactions(rows);
  await db.putTransactions(rows);
  const stored = await db.allTransactions();
  if (stored.length !== 2) throw new Error(`re-import duplicated rows: ${stored.length}`);
});

test('putTransactions updates a row with a known id', async () => {
  await db.clearAll();
  await db.putTransactions([{ id: 'x1', date: '2026-08-01', account: 'Bank', amount: 1000, category: 'Salary', transfer_id: null, note: '' }]);
  await db.putTransactions([{ id: 'x1', date: '2026-08-01', account: 'Bank', amount: 9999, category: 'Salary', transfer_id: null, note: 'edited' }]);
  const stored = await db.allTransactions();
  if (stored.length !== 1) throw new Error('update inserted instead of replacing');
  if (stored[0].amount !== 9999) throw new Error('update did not take effect');
});

test('updating a transfer half amount cascades to the partner', async () => {
  await db.clearAll();
  const [fromId, toId] = await db.addTransfer({ date: '2026-08-06', from: 'Bank', to: 'Savings', amount: 20000, note: '' });
  const rows = await db.allTransactions();
  const from = rows.find((r) => r.id === fromId);
  await db.updateTransaction({ ...from, amount: -30000 });
  const after = await db.allTransactions();
  const newFrom = after.find((r) => r.id === fromId);
  const newTo = after.find((r) => r.id === toId);
  if (newFrom.amount !== -30000) throw new Error(`edited half not updated: ${newFrom.amount}`);
  if (newTo.amount !== 30000) throw new Error(`partner did not cascade: ${newTo.amount}`);
  if (newFrom.amount + newTo.amount !== 0) throw new Error('pair no longer sums to zero');
});

test('updateTransaction rejects clearing a transfer half\'s transfer_id', async () => {
  await db.clearAll();
  const [fromId] = await db.addTransfer({ date: '2026-08-06', from: 'Bank', to: 'Savings', amount: 20000, note: '' });
  const rows = await db.allTransactions();
  const from = rows.find((r) => r.id === fromId);
  let threw = false;
  try {
    await db.updateTransaction({ ...from, transfer_id: null });
  } catch { threw = true; }
  if (!threw) throw new Error('detaching a transfer half must be rejected');
  const after = await db.allTransactions();
  if (after.length !== 2) throw new Error('rejected update must not have partially applied');
});

test('updateTransaction still edits a plain flow normally', async () => {
  await db.clearAll();
  const id = await db.addFlow({ date: '2026-08-03', account: 'Bank', amount: -4500, category: 'Food', note: '' });
  await db.updateTransaction({ id, date: '2026-08-03', account: 'Bank', amount: -5000, category: 'Food', transfer_id: null, note: 'edited' });
  const rows = await db.allTransactions();
  if (rows.length !== 1) throw new Error('flow update changed row count');
  if (rows[0].amount !== -5000) throw new Error('flow amount edit did not take effect');
});

test('updateTransaction allows editing note/date on a transfer half without disturbing the partner', async () => {
  await db.clearAll();
  const [fromId, toId] = await db.addTransfer({ date: '2026-08-06', from: 'Bank', to: 'Savings', amount: 20000, note: '' });
  const rows = await db.allTransactions();
  const from = rows.find((r) => r.id === fromId);
  await db.updateTransaction({ ...from, date: '2026-08-07', note: 'renamed' });
  const after = await db.allTransactions();
  const newFrom = after.find((r) => r.id === fromId);
  const newTo = after.find((r) => r.id === toId);
  if (newFrom.date !== '2026-08-07' || newFrom.note !== 'renamed') throw new Error('note/date edit did not take effect');
  if (newFrom.amount !== -20000) throw new Error('amount should not have changed');
  if (newTo.amount !== 20000 || newTo.transfer_id !== fromId) throw new Error('partner was disturbed by an unrelated field edit');
});


// ---------------------------------------------------------------------------
// The write paths that actually broke.
//
// putAccount and putCategory shipped broken for several versions: each issued
// store.get() AND store.getAll(), then read the getAll result inside the get
// callback, which throws InvalidStateError because IndexedDB had not run it
// yet. It reached the user as "sample data does not work", and it also meant
// no account or category could be saved by hand.
//
// Nothing caught it because these need a live IndexedDB, and the node suite
// has none. This file does. That was the gap, not the absence of tests.
// ---------------------------------------------------------------------------

const clearStore = async (name) => {
  const database = await db.openDb();
  await new Promise((resolve, reject) => {
    const tx = database.transaction(name, 'readwrite');
    tx.objectStore(name).clear();
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
};

test('putAccount creates an account and gives it a position', async () => {
  await clearStore('accounts');
  await db.putAccount('Bank BCA', 12500000);
  const [account] = await db.allAccounts();
  if (!account) throw new Error('no account was written at all');
  if (account.opening_balance !== 12500000) throw new Error(`balance is ${account.opening_balance}`);
  if (!Number.isFinite(account.position)) throw new Error('a new account must carry a position');
});

test('putAccount appends rather than sorting a new account into the middle', async () => {
  await clearStore('accounts');
  await db.putAccount('Zebra', 0);
  await db.putAccount('Apple', 0);
  const byPosition = (await db.allAccounts()).sort((a, b) => a.position - b.position);
  if (byPosition[0].name !== 'Zebra') throw new Error(`first is ${byPosition[0].name}, expected Zebra`);
});

test('putAccount keeps an existing account in place when its balance changes', async () => {
  await clearStore('accounts');
  await db.putAccount('First', 100);
  await db.putAccount('Second', 200);
  const before = (await db.allAccounts()).find((a) => a.name === 'First').position;
  await db.putAccount('First', 999);
  const after = (await db.allAccounts()).find((a) => a.name === 'First');
  if (after.opening_balance !== 999) throw new Error('the balance did not change');
  if (after.position !== before) throw new Error('replacing a balance must not move the account');
});

test('ensureAccount files against an existing account whatever the casing', async () => {
  await clearStore('accounts');
  await db.putAccount('Bank BCA', 500);
  const used = await db.ensureAccount('bank bca', 0);
  const accounts = await db.allAccounts();
  if (accounts.length !== 1) throw new Error(`casing created a second account: ${accounts.length}`);
  if (used !== 'Bank BCA') throw new Error(`filed under "${used}" instead of the existing spelling`);
  if (accounts[0].opening_balance !== 500) throw new Error('the opening balance was overwritten');
});

test('putCategory creates a category with a kind and a position', async () => {
  await db.putCategory('Test Category', { kind: 'expense' });
  const found = (await db.allCategories()).find((c) => c.name === 'Test Category');
  if (!found) throw new Error('no category was written');
  if (found.kind !== 'expense') throw new Error(`kind is ${found.kind}`);
  if (!Number.isFinite(found.position)) throw new Error('a new category must carry a position');
  await db.deleteCategory('Test Category');
});

test('putCategory merges, so a colour survives a kind change', async () => {
  // Three controls each write one field. A plain put would wipe the other two.
  await db.putCategory('Merge Test', { kind: 'expense', colour: '#2B8159' });
  await db.putCategory('Merge Test', { kind: 'income' });
  const found = (await db.allCategories()).find((c) => c.name === 'Merge Test');
  if (found.colour !== '#2B8159') throw new Error(`colour was lost: ${found.colour}`);
  if (found.kind !== 'income') throw new Error('the kind did not change');
  await db.deleteCategory('Merge Test');
});

test('reorderCategories writes the order it is given', async () => {
  const names = (await db.allCategories()).map((c) => c.name);
  const reversed = [...names].reverse();
  await db.reorderCategories(reversed);
  const after = (await db.allCategories()).sort((a, b) => a.position - b.position).map((c) => c.name);
  if (after.join() !== reversed.join()) throw new Error('the stored order does not match');
  await db.reorderCategories(names);
});

test('reorder skips a name that is not there instead of resurrecting it', async () => {
  const names = (await db.allCategories()).map((c) => c.name);
  await db.reorderCategories(['Ghost Category', ...names]);
  const found = (await db.allCategories()).find((c) => c.name === 'Ghost Category');
  if (found) throw new Error('reorder created a category that does not exist');
});

test('editing a transfer date moves BOTH halves', async () => {
  // Cascading only the amount left the money leaving one account a day
  // before it arrived in the other.
  await db.clearAll();
  const [fromId] = await db.addTransfer({ date: '2026-08-06', from: 'Bank', to: 'Savings', amount: 20000, note: '' });
  const rows = await db.allTransactions();
  const half = rows.find((r) => r.id === fromId);
  await db.updateTransaction({ ...half, date: '2026-08-20' });
  const after = await db.allTransactions();
  const dates = new Set(after.map((r) => r.date));
  if (dates.size !== 1) throw new Error(`halves are on different dates: ${[...dates].join(', ')}`);
  if (after.reduce((sum, r) => sum + r.amount, 0) !== 0) throw new Error('the pair no longer nets to zero');
});

test('editing a transfer amount keeps the pair netting to zero', async () => {
  await db.clearAll();
  const [fromId] = await db.addTransfer({ date: '2026-08-06', from: 'Bank', to: 'Savings', amount: 20000, note: '' });
  const half = (await db.allTransactions()).find((r) => r.id === fromId);
  await db.updateTransaction({ ...half, amount: -75000 });
  const after = await db.allTransactions();
  if (after.reduce((sum, r) => sum + r.amount, 0) !== 0) throw new Error('the pair no longer nets to zero');
  if (!after.some((r) => r.amount === 75000)) throw new Error('the partner did not follow the new amount');
});


test('renameAccount moves every transaction with the account', async () => {
  await db.clearAll();
  await db.putAccount('Bank BCA', 1000);
  await db.addFlow({ date: '2026-08-01', account: 'Bank BCA', amount: -500, category: 'Food', note: '' });
  await db.addFlow({ date: '2026-08-02', account: 'Bank BCA', amount: -700, category: 'Food', note: '' });
  await db.renameAccount('Bank BCA', 'BCA');
  const rows = await db.allTransactions();
  const stranded = rows.filter((r) => r.account !== 'BCA');
  if (stranded.length) throw new Error(`${stranded.length} rows still point at the old name`);
  const accounts = await db.allAccounts();
  if (accounts.length !== 1) throw new Error(`expected 1 account, got ${accounts.length}`);
  if (accounts[0].name !== 'BCA') throw new Error(`account is named ${accounts[0].name}`);
});

test('renameAccount keeps the opening balance and the position', async () => {
  await db.clearAll();
  await db.putAccount('First', 12345);
  await db.putAccount('Second', 0);
  const before = (await db.allAccounts()).find((a) => a.name === 'First');
  await db.renameAccount('First', 'Renamed');
  const after = (await db.allAccounts()).find((a) => a.name === 'Renamed');
  if (after.opening_balance !== 12345) throw new Error(`balance changed to ${after.opening_balance}`);
  if (after.position !== before.position) throw new Error('a rename must not move the account in the list');
});

test('renameAccount refuses a name another account already has', async () => {
  await db.clearAll();
  await db.putAccount('Cash', 0);
  await db.putAccount('Bank', 0);
  let threw = false;
  try { await db.renameAccount('Bank', 'cash'); } catch { threw = true; }
  if (!threw) throw new Error('a casing variant of an existing name was accepted');
  const accounts = await db.allAccounts();
  if (accounts.length !== 2) throw new Error('the account set changed despite the refusal');
  if (!accounts.some((a) => a.name === 'Bank')) throw new Error('Bank was lost by a rejected rename');
});

test('a refused rename leaves every transaction untouched', async () => {
  // The whole point of doing this in one transaction: a failure halfway
  // would leave rows pointing at an account that no longer exists.
  await db.clearAll();
  await db.putAccount('Cash', 0);
  await db.putAccount('Bank', 0);
  await db.addFlow({ date: '2026-08-01', account: 'Bank', amount: -500, category: 'Food', note: '' });
  try { await db.renameAccount('Bank', 'Cash'); } catch { /* expected */ }
  const rows = await db.allTransactions();
  if (rows[0].account !== 'Bank') throw new Error(`row moved to ${rows[0].account} despite the refusal`);
});

test('renameAccount follows the default-account setting', async () => {
  await db.clearAll();
  await db.putAccount('Bank', 0);
  await db.putSetting('default-account', 'Bank');
  await db.renameAccount('Bank', 'Bank BCA');
  const preference = await db.getSetting('default-account', '');
  if (preference !== 'Bank BCA') throw new Error(`the default still says "${preference}"`);
});

test('renameAccount rejects an empty name', async () => {
  await db.clearAll();
  await db.putAccount('Bank', 0);
  let threw = false;
  try { await db.renameAccount('Bank', '   '); } catch { threw = true; }
  if (!threw) throw new Error('an account was allowed to have no name');
});

let passed = 0;
for (const { name, fn } of tests) {
  const item = document.createElement('li');
  try {
    await fn();
    item.className = 'pass';
    item.textContent = name;
    passed += 1;
  } catch (error) {
    item.className = 'fail';
    item.textContent = name;
    const detail = document.createElement('pre');
    detail.textContent = error.message;
    item.append(detail);
  }
  results.append(item);
}
document.getElementById('summary').textContent = `${passed} / ${tests.length} passed`;
await db.clearAll();
</script>
</body>
</html>
